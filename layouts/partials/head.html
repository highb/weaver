<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
<meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">

{{- with .Site.Params.webmention }}
{{- with .endpoint }}
<link rel="webmention" href="{{ . }}">
{{- end }}
{{- with .pingback }}
<link rel="pingback" href="{{ . }}">
{{- end }}
{{- end }}

{{- with .OutputFormats.Get "RSS" }}
<link rel="alternate" type="{{ .MediaType }}" href="{{ .Permalink }}" title="{{ $.Site.Title }}">
{{- end }}

{{- with .Site.Params.defaultTheme }}
<link rel="stylesheet" id="weaver-theme" href="{{ (printf "themes/%s.css" .) | relURL }}">
{{- else }}
<link rel="stylesheet" id="weaver-theme">
{{- end }}
<noscript><style>.js-only { display: none; }</style></noscript>
